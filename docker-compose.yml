version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rtb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtb_secure_password_prod}
      POSTGRES_DB: ${POSTGRES_DB:-rtb_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rtb_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtb_user} -d ${POSTGRES_DB:-rtb_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtb_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtb_user}:${POSTGRES_PASSWORD:-rtb_secure_password_prod}@db:5432/${POSTGRES_DB:-rtb_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_vps}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REQUEST_TIMEOUT_MS: 12000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rtb_internal
      - rtb_public
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rtb_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    networks:
      - rtb_internal
      - rtb_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: rtb_postgres_data

networks:
  rtb_internal:
    internal: true
  rtb_public:
    driver: bridge
