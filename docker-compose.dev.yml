version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rtb_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtb
      POSTGRES_PASSWORD: rtb
      POSTGRES_DB: rtb
    ports:
      - "5432:5432"
    volumes:
      - rtb_dev_data:/var/lib/postgresql/data

volumes:
  rtb_dev_data:
